<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" font-family="Inter, Arial, sans-serif" role="img"><title>Pediatric assessment triangle</title><desc>Three boxes joined in a triangle: appearance, work of breathing and circulation to the skin.</desc><rect width="420" height="360" fill="#fff"/><path d="M210 94 L105 200 M210 94 L315 200 M105 245 H315" stroke="#a31c2c" stroke-width="3" fill="none"/><circle cx="210" cy="94" r="6" fill="#a31c2c"/><rect x="95" y="10" width="230" height="84" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2.5"/><text x="210.0" y="34" font-size="15" font-weight="800" text-anchor="middle" fill="#7a1220">Appearance</text><text x="210.0" y="56" font-size="13.5" text-anchor="middle" fill="#1d1d22">Alert? Consolable?</text><text x="210.0" y="74" font-size="13.5" text-anchor="middle" fill="#1d1d22">Eye contact, strong cry,</text><text x="210.0" y="92" font-size="13.5" text-anchor="middle" fill="#1d1d22">normal muscle tone?</text><rect x="10" y="200" width="200" height="100" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2.5"/><text x="110.0" y="224" font-size="15" font-weight="800" text-anchor="middle" fill="#7a1220">Work of breathing</text><text x="110.0" y="246" font-size="13.5" text-anchor="middle" fill="#1d1d22">Fast, noisy or grunting?</text><text x="110.0" y="264" font-size="13.5" text-anchor="middle" fill="#1d1d22">Ribs pulling in?</text><text x="110.0" y="282" font-size="13.5" text-anchor="middle" fill="#1d1d22">Flaring nostrils?</text><rect x="215" y="200" width="195" height="100" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2.5"/><text x="312.5" y="224" font-size="15" font-weight="800" text-anchor="middle" fill="#7a1220">Circulation to skin</text><text x="312.5" y="246" font-size="13.5" text-anchor="middle" fill="#1d1d22">Pale, mottled</text><text x="312.5" y="264" font-size="13.5" text-anchor="middle" fill="#1d1d22">or blue skin</text><text x="312.5" y="282" font-size="13.5" text-anchor="middle" fill="#1d1d22">and lips?</text><text x="210" y="334" font-size="13.5" text-anchor="middle" fill="#5a5e66">Look from a distance, before you touch the child</text></svg>