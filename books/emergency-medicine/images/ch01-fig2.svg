<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Inter, Arial, sans-serif"><rect width="420" height="420" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="12" y="14" width="230" height="72" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="127" y="36" font-size="12" font-weight="700" text-anchor="middle" fill="#7a1220" letter-spacing="1">QUESTION 1</text><text x="127" y="57" font-size="13" text-anchor="middle" fill="#1d1d22">Will this patient die or be</text><text x="127" y="74" font-size="13" text-anchor="middle" fill="#1d1d22">harmed within minutes without help?</text><path d="M127 86 V128" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="137" y="112" font-size="12" font-weight="600" fill="#5a5e66">No</text><rect x="12" y="128" width="230" height="72" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="127" y="150" font-size="12" font-weight="700" text-anchor="middle" fill="#7a1220" letter-spacing="1">QUESTION 2</text><text x="127" y="171" font-size="13" text-anchor="middle" fill="#1d1d22">Could they worsen quickly, be newly</text><text x="127" y="188" font-size="13" text-anchor="middle" fill="#1d1d22">confused, or be in severe pain?</text><path d="M127 200 V242" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="137" y="226" font-size="12" font-weight="600" fill="#5a5e66">No</text><rect x="12" y="242" width="230" height="72" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="127" y="264" font-size="12" font-weight="700" text-anchor="middle" fill="#7a1220" letter-spacing="1">QUESTION 3</text><text x="127" y="285" font-size="13" text-anchor="middle" fill="#1d1d22">How many separate tests or</text><text x="127" y="302" font-size="13" text-anchor="middle" fill="#1d1d22">treatments will they probably need?</text><path d="M242 50 H285" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="248" y="42" font-size="12" font-weight="600" fill="#5a5e66">Yes</text><path d="M242 164 H285" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="248" y="156" font-size="12" font-weight="600" fill="#5a5e66">Yes</text><rect x="285" y="22" width="123" height="56" rx="10" fill="#a31c2c" stroke="#a31c2c" stroke-width="2"/><text x="346.5" y="46.4" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Level 1</text><text x="346.5" y="63.4" font-size="14" font-weight="400" text-anchor="middle" fill="#fff">Act now</text><rect x="285" y="136" width="123" height="56" rx="10" fill="#c4505c" stroke="#c4505c" stroke-width="2"/><text x="346.5" y="160.55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Level 2</text><text x="346.5" y="176.55" font-size="13" font-weight="400" text-anchor="middle" fill="#fff">Should not wait</text><path d="M242 278 H262 M262 257 V345" stroke="#7a1220" stroke-width="2.4" fill="none"/><path d="M262 257 H273" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M262 301 H273" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M262 345 H273" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="275" y="238" width="133" height="38" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="341.5" y="261.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">Several: Level 3</text><rect x="275" y="282" width="133" height="38" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="341.5" y="305.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">One: Level 4</text><rect x="275" y="326" width="133" height="38" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="341.5" y="349.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">None: Level 5</text><rect x="12" y="374" width="396" height="42" rx="10" fill="#e8f1ea" stroke="#2b6a45" stroke-width="2"/><text x="210" y="392" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Then check vital signs:</text><text x="210" y="408" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">consider moving the patient up if in a danger range</text></svg>