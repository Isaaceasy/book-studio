# Book settings read by scripts/bookbuild.py (general / KDP PDF) and scripts/docxbuild.py (Word house style).
# Created by /new-book and edited by later stages. Keep numbers unquoted.

title: "Emergency Nursing Fundamentals"
subtitle: "A Compact Illustrated Guide to Rapid Assessment, Priorities and Procedures for Nursing, Paramedic, EMT and Allied Health Students"
author: "Mark Gerald Simon"            # pen name printed on the book; never invent
publisher: ""           # leave blank unless supplied by the owner
language: "en"          # en, fr, de, es
region: "US" # e.g. US, UK, FR, DE, ES, MX (controls number format, standards, marketplace)
copyright_year: 2026
isbn: ""                # blank = KDP-assigned ISBN
publication_date: "2026-10-29" # date against which time-sensitive facts are checked (YYYY-MM-DD)

# engineering | medical | general
profile: "medical" 
# docx = Word house style (US Letter, 1 in margins, Times New Roman 12). kdp-pdf = KDP print PDF.
# engineering and medical default to docx; general defaults to kdp-pdf.
output: "kdp-pdf" # owner override 2026-10-29: compact 5 x 8 in book (was docx, US Letter)

# STANDARD = approve every chapter. AUTONOMOUS = owner said YES at the end of /outline-book.
run_mode: "AUTONOMOUS"   # owner answered YES 2026-10-29; starts after /design-interior approval; never replaces fact-check, compliance or clinician clearance

# ---- Word house style (docx output) ----
heading_style: 1 # 1 Black Banner, 2 Rule Line, 3 Numbered Block, 4 Centered Classic, 5 Shaded Bar, 6 Underline Accent, 7 Minimal Modern
accent: "A31C2C"   # crimson, chosen at /design-interior 2026-10-29
chapter_word_floor: 5000     # SHORT-BOOK SCOPE LOCK (owner, 2026-10-29): 6 Parts, about 5,000 words each, excluding tables
chapter_word_ceiling: 6000
image_count: 25 # owner decision 2026-10-29 (was 50): total approved figures, about 4 per Part
image_source: "hybrid"   # owner 2026-10-29: ALL anatomical images and illustrations via HiggsField; SVG only for non-anatomical diagrams, algorithms and flowcharts (to confirm)
image_mode: "YES-ALL" # ASK | YES-ALL | NO-ALL | EXTERNAL-ALL | MIXED
copyright_text: ""            # optional custom rights sentence

# ---- KDP print PDF (kdp-pdf output) ----
trim_width_in: 5.0        # smallest US KDP trim (read live 2026-10-29)
trim_height_in: 8.0
margin_top_in: 0.65
margin_bottom_in: 0.7
margin_inside_in: 0.65      # KDP minimum 0.5 in for 151-300 pages (read live 2026-10-29)
margin_outside_in: 0.6       # KDP minimum 0.25 in without bleed; edge tabs sit 0.27 in from trim
color_interior: true

palette:
  accent: "#a31c2c"
  accent_soft: "#fbeced"
fonts:
  body: "Caladea"
  heading: "Inter"

# ---- page furniture (scripts/pagedeco.py): running headers, page numbers, Part edge tabs ----
page_decor: true
running_title: "Emergency Nursing Fundamentals"
part_short_names: {1: "The Emergency Approach", 2: "Airway and Breathing", 3: "Cardiac and Resuscitation", 4: "Trauma, Burns, Environment", 5: "Medical Emergencies", 6: "Special Populations and Safety"}
part_titles:
  - "The Emergency Approach: Safety, Triage and Assessment"
  - "Airway and Breathing Emergencies"
  - "Cardiac Emergencies and Resuscitation"
  - "Trauma, Burns and Environmental Emergencies"
  - "Medical Emergencies"
  - "Special Populations, Behavioral Emergencies and Safety"
reference_openers: ["Appendix A", "Appendix B", "Appendix C", "Glossary", "Index"]
openers_on_right: true   # bookbuild.py inserts blank pages so Part openers are right-hand pages
