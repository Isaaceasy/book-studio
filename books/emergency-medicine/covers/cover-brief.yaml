# Cover brief: Emergency Nursing Fundamentals (cover-design test, 2026-11-02)
# Strings equal books/emergency-medicine/book.yaml (title, subtitle, author). Concept B: dark anatomy poster.

title: "Emergency Nursing Fundamentals"
subtitle: "A Compact Illustrated Guide to Rapid Assessment, Priorities and Procedures for Nursing, Paramedic, EMT and Allied Health Students"
author: "Mark Gerald Simon"

trim: "5x8"
pages: 180            # interior PDF has 179 pages; KDP adds a blank page to make it even, so the spine uses 180
paper: "white"
ink: "color"          # standard color
paperback: true
spine_text: true

art:
  front: "art/front-art-1-4k.png"
  back: "art/back-art-2k.png"

# Back cover copy: from final/KDP-metadata.md (approved wording, factual, no reviews, no prices, no claims)
back_headline: "Your first emergency shift will not wait for you to feel ready."
back_paragraphs:
  - "A patient is struggling to breathe, another is bleeding, and a family member is asking what is happening. In those moments you need a clear order of thinking more than a long chapter. Emergency Nursing Fundamentals gives you that order in a compact, illustrated guide: make the scene safe, sort who cannot wait, assess in a fixed sequence, then treat the problem in front of you."
  # COVER VARIANT (deliberate): the description's "Who it is for" sentence has no verb on its own; on the cover it opens with "Written for". The KDP description keeps its heading context. Recorded in cover-log.md.
  - "Written for nursing, paramedic, EMT and allied health students, and new responders who want a clear first guide to emergency care. It is written in plain language for United States practice. It gives no medicine doses and does not replace your course, instructor, local protocol or medical direction."

palette:
  bg: "#101826"
  title: "#ffffff"
  subtitle: "#d9dde6"
  author: "#f2c6cc"
  accent: "#a31c2c"
fonts:
  title: "Inter"
  body: "Inter"
title_size_pt: 34
subtitle_size_pt: 13
author_size_pt: 14
overlay_opacity: 0.0

# Fonts: Inter (static TrueType files in v3/fonts), SIL Open Font License 1.1; embedded in the PDF. Confirm the licence file ships with the font files.
