<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310" font-family="Inter, Arial, sans-serif"><rect width="420" height="310" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="12" y="12" width="396" height="62" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><rect x="12" y="12" width="62" height="62" rx="10" fill="#a31c2c"/><text x="43" y="54" font-size="32" font-weight="800" text-anchor="middle" fill="#fff">S</text><text x="88" y="38" font-size="14" font-weight="800" fill="#7a1220">Situation</text><text x="88" y="56" font-size="12.5" fill="#1d1d22">Who is the patient, and what is the main</text><text x="88" y="70" font-size="12.5" fill="#1d1d22">problem now?</text><rect x="12" y="86" width="396" height="62" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><rect x="12" y="86" width="62" height="62" rx="10" fill="#a31c2c"/><text x="43" y="128" font-size="32" font-weight="800" text-anchor="middle" fill="#fff">B</text><text x="88" y="112" font-size="14" font-weight="800" fill="#7a1220">Background</text><text x="88" y="130" font-size="12.5" fill="#1d1d22">What led up to this? History, allergies,</text><text x="88" y="144" font-size="12.5" fill="#1d1d22">medicines.</text><rect x="12" y="160" width="396" height="62" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><rect x="12" y="160" width="62" height="62" rx="10" fill="#a31c2c"/><text x="43" y="202" font-size="32" font-weight="800" text-anchor="middle" fill="#fff">A</text><text x="88" y="186" font-size="14" font-weight="800" fill="#7a1220">Assessment</text><text x="88" y="204" font-size="12.5" fill="#1d1d22">What did you find, in survey order, and</text><text x="88" y="218" font-size="12.5" fill="#1d1d22">what did you do?</text><rect x="12" y="234" width="396" height="62" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><rect x="12" y="234" width="62" height="62" rx="10" fill="#a31c2c"/><text x="43" y="276" font-size="32" font-weight="800" text-anchor="middle" fill="#fff">R</text><text x="88" y="260" font-size="14" font-weight="800" fill="#7a1220">Recommendation</text><text x="88" y="278" font-size="12.5" fill="#1d1d22">What should happen next, or what do you</text><text x="88" y="292" font-size="12.5" fill="#1d1d22">need?</text></svg>