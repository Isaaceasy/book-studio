<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" font-family="Inter, Arial, sans-serif" role="img"><title>Sepsis recognition pathway</title><desc>Flow from a suspected infection and warning signs to a call for help and reassessment.</desc><rect width="420" height="470" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="60" y="8" width="300" height="44" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="210.0" y="26.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Possible infection</text><text x="210.0" y="42.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">fever or chills, known infection, recent wound</text><path d="M210 52 V70" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="10" y="70" width="400" height="106" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="96.375" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Any of these warning signs?</text><text x="210.0" y="111.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">New confusion or drowsiness</text><text x="210.0" y="127.375" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Fast breathing or fast heart rate</text><text x="210.0" y="142.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Low blood pressure, cool or mottled skin</text><text x="210.0" y="158.375" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Looks very unwell</text><path d="M210 176 V196" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="222" y="190" font-size="12" font-weight="700" fill="#5a5e66">Yes</text><rect x="60" y="196" width="300" height="52" rx="10" fill="#a31c2c" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="218.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">Suspect sepsis</text><text x="210.0" y="234.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#fff">Call for help and say the word sepsis</text><path d="M210 248 V268" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="268" width="300" height="52" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="290.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Check airway, breathing, circulation</text><text x="210.0" y="306.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">record vital signs with the times</text><path d="M210 320 V340" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="340" width="300" height="40" rx="10" fill="#e8f1ea" stroke="#2b6a45" stroke-width="2"/><text x="210.0" y="364.375" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Oxygen as protocol directs, keep warm</text><path d="M210 380 V398" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="398" width="300" height="56" rx="10" fill="#fff" stroke="#7a1220" stroke-width="2"/><text x="210.0" y="422.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Reassess often</text><text x="210.0" y="438.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">trained clinicians give the treatment</text></svg>