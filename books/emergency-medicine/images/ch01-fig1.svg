<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" font-family="Inter, Arial, sans-serif"><rect width="420" height="250" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="12" y="10" width="200" height="40" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="112" y="35" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">First look: about 30 seconds</text><path d="M52 50 V78" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><circle cx="52" cy="108" r="26" fill="#a31c2c"/><text x="52" y="118" font-size="27" font-weight="800" text-anchor="middle" fill="#fff">A</text><text x="52" y="154" font-size="12.5" font-weight="600" text-anchor="middle" fill="#7a1220">Airway</text><path d="M80 108 H101" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><circle cx="131" cy="108" r="26" fill="#a31c2c"/><text x="131" y="118" font-size="27" font-weight="800" text-anchor="middle" fill="#fff">B</text><text x="131" y="154" font-size="12.5" font-weight="600" text-anchor="middle" fill="#7a1220">Breathing</text><path d="M159 108 H180" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><circle cx="210" cy="108" r="26" fill="#a31c2c"/><text x="210" y="118" font-size="27" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="210" y="154" font-size="12.5" font-weight="600" text-anchor="middle" fill="#7a1220">Circulation</text><path d="M238 108 H259" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><circle cx="289" cy="108" r="26" fill="#a31c2c"/><text x="289" y="118" font-size="27" font-weight="800" text-anchor="middle" fill="#fff">D</text><text x="289" y="154" font-size="12.5" font-weight="600" text-anchor="middle" fill="#7a1220">Disability</text><path d="M317 108 H338" stroke="#7a1220" stroke-width="2.4" fill="non