<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 500" width="420" height="500" font-family="Inter, Arial, sans-serif" role="img"><title>Adult cardiac arrest response</title><desc>Flow from recognition through compressions and AED use to handover.</desc><rect width="420" height="500" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="60" y="8" width="300" height="44" rx="10" fill="#a31c2c" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="34.55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Unresponsive and not breathing normally</text><path d="M210 52 V72" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="72" width="300" height="44" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="98.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">Call for help and send for an AED</text><path d="M210 116 V136" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="136" width="300" height="56" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="160.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Start chest compressions</text><text x="210.0" y="176.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">100 to 120 a minute, at least 2 in (5 cm)</text><path d="M210 192 V212" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="212" width="300" height="44" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="210.0" y="238.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">AED arrives: switch on, attach pads</text><path d="M210 256 V276" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="110" y="276" width="200" height="44" rx="10" fill="#fff" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="302.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">Does it advise a shock?</text><path d="M110 298 H60 V340" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M310 298 H360 V340" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="64" y="292" font-size="12" font-weight="700" fill="#5a5e66">Yes</text><text x="318" y="292" font-size="12" font-weight="700" fill="#5a5e66">No</text><rect x="8" y="340" width="190" height="48" rx="10" fill="#e8f1ea" stroke="#2b6a45" stroke-width="2"/><text x="103.0" y="360.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Stand clear</text><text x="103.0" y="376.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">press the shock button</text><rect x="222" y="340" width="190" height="48" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="317.0" y="360.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">No shock advised</text><text x="317.0" y="376.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">keep following prompts</text><path d="M103 388 V412 H190" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M317 388 V412 H230" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="412" width="300" height="38" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="435.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d22">Resume compressions at once; swap about every 2 minutes</text><path d="M210 450 V468" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="468" width="300" height="28" rx="10" fill="#fff" stroke="#7a1220" stroke-width="2"/><text x="210.0" y="486.025" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Continue until help takes over or the patient responds</text></svg>