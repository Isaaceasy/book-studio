<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" font-family="Inter, Arial, sans-serif" role="img"><title>First priorities for difficulty breathing</title><desc>Flow from first look to judging severity, then severe or less severe actions, then repeated reassessment.</desc><rect width="420" height="430" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="90" y="10" width="240" height="40" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="210.0" y="34.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">Difficulty breathing: first look</text><path d="M210 50 V72" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="40" y="72" width="340" height="62" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="99.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1d22">Judge severity</text><text x="210.0" y="115.55" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1d22">speech, effort, lip color, alertness</text><path d="M120 134 V168" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M300 134 V168" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="128" y="156" font-size="12" font-weight="700" fill="#5a5e66">Severe</text><text x="308" y="156" font-size="12" font-weight="700" fill="#5a5e66">Less severe</text><rect x="10" y="168" width="200" height="100" rx="10" fill="#a31c2c" stroke="#a31c2c" stroke-width="2"/><text x="110.0" y="199.125" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">Call for help now</text><text x="110.0" y="214.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#fff">Sit the patient upright</text><text x="110.0" y="230.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#fff">Oxygen as protocol directs</text><text x="110.0" y="245.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#fff">Be ready to support breathing</text><rect x="220" y="168" width="190" height="100" rx="10" fill="#e8f1ea" stroke="#2b6a45" stroke-width="2"/><text x="315.0" y="199.125" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Sit upright, reassure</text><text x="315.0" y="214.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Help with own reliever</text><text x="315.0" y="230.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">if protocol allows</text><text x="315.0" y="245.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Call for help if worse</text><path d="M110 268 V288 H150 V308" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M315 268 V288 H270 V308" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="90" y="308" width="240" height="52" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="330.7" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1d22">Recheck at short intervals</text><text x="210.0" y="345.7" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1d22">rate, effort, speech, color, alertness</text><path d="M110 334 H22 V190" stroke="#7a1220" stroke-width="0" fill="none"/><rect x="10" y="376" width="400" height="40" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="210.0" y="400.375" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">A quiet, calm patient who is not improving may be tiring</text></svg>