<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" font-family="Inter, Arial, sans-serif" role="img"><title>Altered mental status approach</title><desc>Flow from first look through airway, breathing and glucose to reversible causes and a call for help.</desc><rect width="420" height="470" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1220"/></marker></defs><rect x="60" y="8" width="300" height="40" rx="10" fill="#a31c2c" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="32.55" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Patient less alert or confused</text><path d="M210 48 V66" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="66" width="300" height="48" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="86.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Airway and breathing</text><text x="210.0" y="102.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">open? enough oxygen? treat first</text><path d="M210 114 V132" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="132" width="300" height="48" rx="10" fill="#fbeced" stroke="#a31c2c" stroke-width="2"/><text x="210.0" y="152.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Blood glucose</text><text x="210.0" y="168.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">check if your role allows</text><path d="M210 180 V198" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="10" y="198" width="400" height="104" rx="10" fill="#f6efe4" stroke="#b7925a" stroke-width="2"/><text x="210.0" y="231.125" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Look for other reversible causes</text><text x="210.0" y="246.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Stroke signs, head injury, infection or sepsis</text><text x="210.0" y="262.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Poisoning or overdose, seizure, heat or cold</text><text x="210.0" y="277.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">Low blood pressure or shock</text><path d="M210 302 V322" stroke="#7a1220" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="60" y="322" width="300" height="48" rx="10" fill="#e8f1ea" stroke="#2b6a45" stroke-width="2"/><text x="210.0" y="342.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Call for help early</text><text x="210.0" y="358.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">and keep rechecking</text><rect x="10" y="386" width="400" height="66" rx="10" fill="#fff" stroke="#7a1220" stroke-width="2"/><text x="210.0" y="415.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1d22">Do not assume the cause is alcohol or age</text><text x="210.0" y="431.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1d22">until reversible causes are checked</text></svg>