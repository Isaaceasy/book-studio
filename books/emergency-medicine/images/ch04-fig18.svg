<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Inter, Arial, sans-serif" role="img"><title>Cold to heat illness</title><desc>Five stages from severe cold illness through the comfortable range to heat stroke, with signs and first actions.</desc><rect width="420" height="420" fill="#fff"/><rect x="10" y="10" width="110" height="70" rx="10" fill="#2c3a48"/><text x="65" y="41" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">Severe</text><text x="65" y="58" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">cold illness</text><rect x="124" y="10" width="286" height="70" rx="10" fill="#fff" stroke="#2c3a48" stroke-width="2"/><text x="136" y="34" font-size="13" font-weight="700" fill="#1d1d22">Shivering stops, drowsy, slow pulse</text><text x="136" y="57" font-size="12.5" fill="#7a1220">Move gently, insulate, call for help</text><rect x="10" y="90" width="110" height="70" rx="10" fill="#5b7a96"/><text x="65" y="121" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">Mild</text><text x="65" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">cold illness</text><rect x="124" y="90" width="286" height="70" rx="10" fill="#fff" stroke="#5b7a96" stroke-width="2"/><text x="136" y="114" font-size="13" font-weight="700" fill="#1d1d22">Shivering, clumsy, confused</text><text x="136" y="137" font-size="12.5" fill="#7a1220">Dry clothes, shelter, warm gradually</text><rect x="10" y="170" width="110" height="70" rx="10" fill="#e8f1ea"/><text x="65" y="201" font-size="13" font-weight="800" text-anchor="middle" fill="#1d1d22">Comfortable</text><text x="65" y="218" font-size="13" font-weight="800" text-anchor="middle" fill="#1d1d22">range</text><rect x="124" y="170" width="286" height="70" rx="10" fill="#fff" stroke="#e8f1ea" stroke-width="2"/><text x="136" y="194" font-size="13" font-weight="700" fill="#1d1d22">Alert, normal skin, sweating as needed</text><text x="136" y="217" font-size="12.5" fill="#7a1220">No action needed</text><rect x="10" y="250" width="110" height="70" rx="10" fill="#e9a06a"/><text x="65" y="281" font-size="13" font-weight="800" text-anchor="middle" fill="#1d1d22">Heat</text><text x="65" y="298" font-size="13" font-weight="800" text-anchor="middle" fill="#1d1d22">exhaustion</text><rect x="124" y="250" width="286" height="70" rx="10" fill="#fff" stroke="#e9a06a" stroke-width="2"/><text x="136" y="274" font-size="13" font-weight="700" fill="#1d1d22">Heavy sweating, weak, headache, nausea</text><text x="136" y="297" font-size="12.5" fill="#7a1220">Cool place, loosen clothing, sip drinks</text><rect x="10" y="330" width="110" height="70" rx="10" fill="#a31c2c"/><text x="65" y="361" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">Heat</text><text x="65" y="378" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">stroke</text><rect x="124" y="330" width="286" height="70" rx="10" fill="#fff" stroke="#a31c2c" stroke-width="2"/><text x="136" y="354" font-size="13" font-weight="700" fill="#1d1d22">Confused, faints, seizure, collapse</text><text x="136" y="377" font-size="12.5" fill="#7a1220">Call for help, cool the body quickly</text></svg>